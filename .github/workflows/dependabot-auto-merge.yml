# Padrão oficial do GitHub para merge automático do Dependabot:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
# Patch e minor entram sozinhos quando os checks obrigatórios do repositório passam.
# Major fica aberto para um agente revisar.
name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: squash, merge ou rebase, conforme o repositório permite
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: [self-hosted, Linux, X64, monstrinho]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto "--${MERGE_METHOD}" "$PR_URL"
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
